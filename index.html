    <meta property="og:title" content="JINNYPARK PHOTOGRAPHY - 포토그래피 포트폴리오">

    <meta property="og:type" content="website">
    <meta name="google-site-verification" content="">
    <title>JINNYPARK PHOTOGRAPHY - Home</title>
    <link rel="canonical" href="https://jinnyparkphotography.github.io/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">JINNYPARK PHOTOGRAPHY</a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link active">Home</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>

    <main class="main-content">
        <div class="container">
            <section class="gallery-section">
                <h1 class="gallery-title">Gallery</h1>
                <div class="gallery-grid">
                    <!-- 샘플 이미지 10개 -->
                    <div class="gallery-item" data-index="1">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=500&fit=crop" alt="Gallery Image 1">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="2">
                        <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=400&h=500&fit=crop" alt="Gallery Image 2">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="3">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=300&fit=crop" alt="Gallery Image 3">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="4">

                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="5">
                        <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=400&h=600&fit=crop" alt="Gallery Image 5">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="6">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=400&fit=crop" alt="Gallery Image 6">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="7">
                        <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=400&h=500&fit=crop" alt="Gallery Image 7">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="8">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=350&fit=crop" alt="Gallery Image 8">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="9">
                        <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=400&h=450&fit=crop" alt="Gallery Image 9">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="10">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=500&fit=crop" alt="Gallery Image 10">
                        <div class="overlay">Click to view</div>
                    </div>
                    <!-- 새 이미지는 여기에 추가 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 모달 팝업 -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <img class="modal-image" id="modalImage" src="" alt="Full size image">
            <div class="modal-info">
                <h2 id="modalTitle">Image Title</h2>
                <p id="modalDescription">Image description goes here</p>
            </div>
        </div>
    </div>

    <!-- 풋터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Jinny Park Photography. All rights reserved.</p>
        </div>
    </footer>
