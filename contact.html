<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jinny Park 포토그래퍼 연락처 - 촬영 문의 및 협업 제안">
    <meta name="keywords" content="연락처, 문의, 촬영, 포토그래퍼">
    <meta name="author" content="Jinny Park">
    <meta property="og:title" content="JINNYPARK PHOTOGRAPHY - Contact">
    <meta property="og:description" content="Jinny Park 포토그래퍼 연락처">
    <meta property="og:type" content="website">
    <title>JINNYPARK PHOTOGRAPHY - Contact</title>
    <link rel="canonical" href="https://jinnyparkphotography.github.io/contact.html">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">JINNYPARK PHOTOGRAPHY</a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link active">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container">
            <section class="contact-section">
                <h1 class="contact-title">Contact Me</h1>
                <p class="contact-subtitle">촬영 문의 및 협업 제안은 아래 양식을 통해 연락주세��.</p>

                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="subject" class="form-label">제목</label>
                        <input type="text" id="subject" name="subject" class="form-input" placeholder="제목을 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">내용</label>
                        <textarea id="message" name="message" class="form-textarea" placeholder="내용을 입력하세요" rows="8" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">전송</button>
                </form>
            </section>
        </div>
    </main>

    <!-- 풋터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Jinny Park Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
