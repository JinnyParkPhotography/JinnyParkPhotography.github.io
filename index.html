<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jinny Park의 포토그래피 포트폴리오 - 전문 사진가의 작품을 만나보세요.">
    <meta name="keywords" content="사진, 포트폴리오, 포토그래피, Jinny Park">
    <meta name="author" content="Jinny Park">
    <meta property="og:title" content="JINNYPARK PHOTOGRAPHY - 포토그래피 포트폴리오">
    <meta property="og:description" content="전문 사진가 Jinny Park의 포트폴리오입니다.">
    <meta property="og:type" content="website">
    <meta name="google-site-verification" content="">
    <title>JINNYPARK PHOTOGRAPHY - Home</title>
    <link rel="canonical" href="https://jinnyparkphotography.github.io/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">JINNYPARK PHOTOGRAPHY</a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link active">Home</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container">
            <section class="gallery-section">
                <div class="gallery-grid">
                    <!-- 랜덤 크기의 이미지 10개 -->
                    <div class="gallery-item" data-index="1">
                        <img src="https://images.unsplash.com/photo-1606933248051-5ce98adc16fa?w=400&h=500&fit=crop" alt="Professional Portrait 1">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item gallery-item--tall" data-index="2">
                        <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=400&h=700&fit=crop" alt="Professional Portrait 2">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item gallery-item--wide" data-index="3">
                        <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600&h=400&fit=crop" alt="Landscape Photography 1">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="4">
                        <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=400&h=500&fit=crop" alt="Professional Portrait 3">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item gallery-item--tall" data-index="5">
                        <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=400&h=700&fit=crop" alt="Professional Portrait 4">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="6">
                        <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=400&h=500&fit=crop" alt="Professional Photography 1">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item gallery-item--wide" data-index="7">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=600&h=400&fit=crop" alt="Professional Photography 2">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="8">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=500&fit=crop" alt="Professional Portrait 5">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item" data-index="9">
                        <img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=400&h=500&fit=crop" alt="Professional Photography 3">
                        <div class="overlay">Click to view</div>
                    </div>
                    <div class="gallery-item gallery-item--tall" data-index="10">
                        <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=400&h=700&fit=crop" alt="Professional Portrait 6">
                        <div class="overlay">Click to view</div>
                    </div>
                    <!-- 새 이미지는 여기에 추가 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 모달 팝업 -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <img class="modal-image" id="modalImage" src="" alt="Full size image">
            <div class="modal-info">
                <h2 id="modalTitle">Image Title</h2>
                <p id="modalDescription">Image description goes here</p>
            </div>
        </div>
    </div>

    <!-- 풋터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Jinny Park Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
