<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jinny Park의 포토그래피 포트폴리오 - 전문 사진가의 작품을 만나보세요.">
    <meta name="keywords" content="사진, 포트폴리오, 포토그래피, Jinny Park">
    <meta name="author" content="Jinny Park">
    <meta property="og:title" content="JINNYPARK PHOTOGRAPHY - 포토그래피 포트폴리오">
    <meta property="og:description" content="전문 사진가 Jinny Park의 포트폴리오입니다.">
    <meta property="og:type" content="website">
    <meta name="google-site-verification" content="">
    <title>JINNYPARK PHOTOGRAPHY - Home</title>
    <link rel="canonical" href="https://jinnyparkphotography.github.io/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">JINNYPARK PHOTOGRAPHY</a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link active">Home</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container">
            <section class="gallery-section">
                <div class="gallery-grid" id="galleryGrid">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 모달 팝업 -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <img class="modal-image" id="modalImage" src="" alt="Full size image">
            <div class="modal-info">
                <h2 id="modalTitle">Image Title</h2>
                <p id="modalDescription">Image description goes here</p>
            </div>
        </div>
    </div>

    <!-- 풋터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Jinny Park Photography. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
